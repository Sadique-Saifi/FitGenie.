<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGenie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">

        <div class="logo">FitGenie</div>

        <ul class="nav-links">
            <li><a href="bmi.html">BMI</a></li>
            <li><a href="blog.html" target="_blank">Blog</a></li>
            <li><a href="about.html" target="_blank">About</a></li>
        </ul>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="bmi.html">BMI</a>
        <a href="blog.html" target="_blank">Blog</a>
        <a href="about.html" target="_blank">About</a>
    </div>

</header>

<section class="hero">

    <div class="left">

        <span class="badge">
            AI Powered Fitness Platform
        </span>

        <h1>
            Build Better Habits.<br>
            Achieve Better Results.
        </h1>

        <p>
            Track workouts, monitor your health,
            follow personalized diet plans,
            and reach your fitness goals with FitGenie.
        </p>

        <div class="features">

            <div class="card"> Workout Plans</div>
            <div class="card"> Diet Tracker</div>
            <div class="card"> Analytics</div>
            <div class="card"> Wellness</div>

        </div>

    </div>

    <div class="right">
        <div class="form-box">
            <div class="tabs">

                <button class="tab active" id="loginTab"
                    onclick="showLogin()">
                    Login
                </button>

                <button class="tab" id="registerTab"
                    onclick="showRegister()">
                    Register
                </button>
            </div>

            <form id="loginForm">
                <label for="loginemail">Email:</label>
                <input type="email" id="loginemail" placeholder="Email" required>

                <label for="loginpassword">Password:</label>
                <input type="password" id="loginpassword" placeholder="Password" required>

                <button type="submit" class="submit-btn">
                    Login
                </button>
            </form>

            <form id="registerForm" style="display:none;">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Full Name" required>

                <label for="registeremail">Email:</label>
                <input type="email" id="registeremail" placeholder="Email" required>

                <label for="registerpassword">Password:</label>
                <input type="password" id="registerpassword" placeholder="Password" required>

                <button type="submit" class="submit-btn">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</section>

<script>
function toggleMenu(){

const menu = document.getElementById("mobileMenu");

    if(menu.style.display==="block"){
        menu.style.display="none";
    }else{
        menu.style.display="block";
    }

}

const loginForm=document.getElementById("loginForm");
const registerForm=document.getElementById("registerForm");

const loginTab=document.getElementById("loginTab");
const registerTab=document.getElementById("registerTab");

function showLogin(){

    loginForm.style.display="block";
    registerForm.style.display="none";

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

}

function showRegister(){

    loginForm.style.display="none";
    registerForm.style.display="block";

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

}
</script>

</body>
</html>
